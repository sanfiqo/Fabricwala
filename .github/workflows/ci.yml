name: CI

on:
  push:
    branches: [main, "backend/**", "frontend/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TextileConnect.slnx
      - name: Build
        run: dotnet build TextileConnect.slnx --no-restore
      - name: Tests (in-memory suite; the MySQL tests are skipped here)
        run: dotnet test TextileConnect.slnx --no-build --logger "trx;LogFileName=inmemory.trx"
      - name: Tests (MySQL suite, every test gets its own database built from the migrations)
        env:
          TEXTILECONNECT_TEST_MYSQL: "Server=127.0.0.1;Port=3306;Uid=root;Pwd=root;SslMode=Disabled"
        run: >-
          dotnet test TextileConnect.slnx --no-build
          --filter "FullyQualifiedName~MySqlSuiteTests|FullyQualifiedName~MySqlFlowIntegrationTests|FullyQualifiedName~ProductSearchMySqlTests"
          --logger "trx;LogFileName=mysql.trx"
      - name: Vulnerable packages (fails when any is found)
        run: |
          dotnet list TextileConnect.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then echo "Vulnerable packages found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
